<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكتب DOMAINS الافتراضي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ocean:#00175A;--blue:#0616C4;--violet:#8042EB;--bg:#f4f5fb;--panel:#fff;--ink:#0b1230;--muted:#5b6487;--line:#e1e4f0;--soft:#f0f1fa;--ok:#18a864;--warn:#e09612;--bad:#e5484d}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Tajawal,system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
header{height:56px;background:var(--ocean);color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;position:relative;z-index:5}
.logo{font-weight:800;letter-spacing:.5px;font-size:19px}
.logo small{font-weight:500;opacity:.75;font-size:13px;margin-inline-start:6px;letter-spacing:0}
header .sp{flex:1}
header select,header .hb{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px;height:36px;padding:0 10px;cursor:pointer}
header select option{color:#0b1230}
.online{display:flex;align-items:center;gap:6px;font-size:13px;opacity:.9;white-space:nowrap}
.online i{width:8px;height:8px;border-radius:50%;background:#2fd28a;display:inline-block}
.online i.off{background:#e5484d}
#stage{position:absolute;top:56px;left:0;right:0;bottom:0}
canvas#map{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.help{position:absolute;bottom:12px;right:50%;transform:translateX(50%);background:rgba(0,23,90,.86);color:#fff;padding:6px 14px;border-radius:999px;font-size:13px;white-space:nowrap;pointer-events:none}
#panel{position:absolute;left:12px;top:12px;bottom:12px;width:min(370px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,23,90,.22);display:flex;flex-direction:column;overflow:hidden;transition:transform .22s ease,opacity .22s;z-index:3}
#panel.hide{transform:translateX(-24px);opacity:0;pointer-events:none}
.ph{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.ph b{display:block;font-size:16px}.ph small{color:var(--muted);font-size:12.5px}
.pdot{width:34px;height:34px;border-radius:50%;flex:none;border:3px solid var(--soft)}
.x{margin-inline-start:auto;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);width:36px;height:36px;border-radius:8px;flex:none}
.x:hover{background:var(--soft)}
.tabs{display:flex;gap:4px;padding:8px 10px 0}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:8px;cursor:pointer;color:var(--muted);font-weight:700}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.pane{flex:1;display:flex;flex-direction:column;overflow:hidden}
.pane[hidden]{display:none}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:8px 11px;border-radius:14px;background:var(--soft);align-self:flex-end;white-space:pre-wrap;overflow-wrap:anywhere}
.m.me{align-self:flex-start;background:var(--blue);color:#fff}
.m small{display:block;font-size:11.5px;opacity:.7;font-weight:700;margin-bottom:2px}
.m.sys{align-self:center;background:none;color:var(--muted);font-size:13px;text-align:center}
.typing{color:var(--muted);font-size:13px;padding:0 14px 6px}
form.send{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
input,select.in{height:42px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 10px;font-size:16px;flex:1}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--violet);outline-offset:1px}
.btn{height:42px;border:0;border-radius:10px;background:var(--blue);color:#fff;padding:0 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.vi{background:var(--violet)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.scrollp{flex:1;overflow-y:auto;padding:12px}
.sec{margin-bottom:16px}
.sec h4{margin:0 0 6px;font-size:14px;color:var(--ocean)}
.sec ul{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:4px}
.sec li{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:6px 10px;font-size:14px}
.sec li span{flex:1;overflow-wrap:anywhere}
.sec li.done span{text-decoration:line-through;opacity:.6}
.sec li a{color:var(--blue);overflow-wrap:anywhere}
.sec li em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.sec li button{background:none;border:0;cursor:pointer;color:var(--muted);font-size:16px}
.sec form{display:flex;gap:6px;flex-wrap:wrap}
.sec form input{min-width:120px}
.empty{color:var(--muted);font-size:13px;padding:2px 2px 6px}
.note{margin:10px 12px 0;background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.row{display:flex;gap:6px;padding:10px 12px 0;flex-wrap:wrap}
.row .btn{height:36px;font-size:13.5px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 6px}
.chips button{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px}
.card{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.card b{display:block;font-size:15px}.card small{color:var(--muted)}
.card ul{margin:4px 0;padding-inline-start:18px}
.big{padding:18px 16px}.big p{margin:0 0 12px;color:var(--muted)}
#toasts{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:9;max-width:min(340px,calc(100% - 24px))}
.toast{background:var(--ocean);color:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px;animation:tin .25s ease}
.toast .btn{height:32px;margin-top:8px;margin-inline-end:6px;font-size:13px}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
/* شريط الصوت */
#vbar{position:absolute;bottom:12px;z-index:7;right:50%;transform:translateX(50%);background:var(--ocean);color:#fff;border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 34px rgba(0,23,90,.35);max-width:calc(100% - 24px);flex-wrap:wrap;justify-content:center}
#vbar[hidden]{display:none}
#vbar .ch{font-weight:800;font-size:14px;padding:0 6px;white-space:nowrap}
#vbar .ppl{display:flex;gap:4px;flex-wrap:wrap}
#vbar .pp{background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;font-size:12.5px;border:2px solid transparent;white-space:nowrap}
#vbar .pp.sp{border-color:#2fd28a;background:rgba(47,210,138,.2)}
#vbar .pp.bad{opacity:.55}
#vbar button{height:36px;border:0;border-radius:10px;padding:0 12px;cursor:pointer;font-weight:700;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
#vbar button.on{background:#e5484d}
#vbar button.live{background:#2fd28a;color:#00175A}
/* عارض الشاشة */
#screen{position:absolute;right:12px;top:12px;width:min(560px,calc(100% - 24px));background:#0a0f26;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35);z-index:6;display:flex;flex-direction:column}
#screen[hidden]{display:none}
#screen .sh{display:flex;align-items:center;gap:8px;padding:8px 10px;color:#fff;font-size:13.5px;font-weight:700}
#screen .sh span{flex:1}
#screen .sh button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;height:30px;padding:0 10px;cursor:pointer}
#screen video{width:100%;max-height:60vh;background:#000;display:block}
#screen.full{inset:12px;width:auto}#screen.full video{max-height:none;flex:1}
/* لوحة التخطيط */
#board{position:absolute;left:12px;top:12px;bottom:72px;right:12px;background:var(--panel);border-radius:18px;box-shadow:0 24px 70px rgba(0,23,90,.3);z-index:5;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
#board[hidden]{display:none}
.bh{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--ocean);color:#fff;flex-wrap:wrap}
.bh h2{margin:0;font-size:22px;line-height:1.2}
.bh small{opacity:.8;font-size:13px}
.ring{width:56px;height:56px;flex:none}
.bstats{display:flex;gap:16px;font-size:13px;flex-wrap:wrap}
.bstats b{display:block;font-size:20px;line-height:1.1}
.bh .x{color:#fff}
.bh .x:hover{background:rgba(255,255,255,.12)}
.bwho{font-size:12.5px;opacity:.9}
.kpis{display:flex;gap:10px;padding:12px 18px 4px;overflow-x:auto;flex:none}
.kpi{background:var(--soft);border-radius:12px;padding:8px 12px;min-width:170px;flex:none;font-size:13px;position:relative}
.kpi b{display:block;font-size:14px;padding-inline-end:16px}
.kpi .bar{height:7px;background:#dfe2f2;border-radius:9px;overflow:hidden;margin:6px 0 4px}
.kpi .bar i{display:block;height:100%;background:var(--violet)}
.kpi input{height:30px;width:80px;font-size:14px;padding:0 6px;flex:none}
.kpi .del{position:absolute;left:6px;top:4px;background:none;border:0;cursor:pointer;color:var(--muted)}
.kpi.add{display:flex;gap:6px;align-items:center;background:none;border:1px dashed var(--line)}
.kpi.add input{width:auto;flex:1;min-width:70px}
.cols{flex:1;display:flex;gap:12px;padding:12px 18px 18px;overflow-x:auto;align-items:flex-start}
.col{background:var(--soft);border-radius:14px;width:290px;flex:none;max-height:100%;display:flex;flex-direction:column}
.colh{display:flex;align-items:center;gap:6px;padding:10px 12px 6px}
.colh input{height:32px;font-weight:800;background:transparent;border-color:transparent;font-size:15px;padding:0 4px}
.colh input:focus{background:#fff;border-color:var(--line)}
.colh em{font-style:normal;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;color:#fff}
.colh .del{background:none;border:0;cursor:pointer;color:var(--muted);font-size:16px}
.cbar{height:5px;background:#dfe2f2;margin:0 12px 6px;border-radius:9px;overflow:hidden}.cbar i{display:block;height:100%;background:var(--ok)}
.tasks{overflow-y:auto;padding:0 8px;display:flex;flex-direction:column;gap:6px}
.task{background:#fff;border-radius:10px;padding:8px 10px;font-size:14px;border:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 8px;align-items:start}
.task.done .tt{text-decoration:line-through;opacity:.55}
.task.late{border-color:#f1b4b6;background:#fff6f6}
.task input[type=checkbox]{width:18px;height:18px;margin-top:2px}
.task .meta{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.task .meta select,.task .meta input{height:28px;font-size:12.5px;padding:0 6px;border-radius:8px;flex:none;width:auto;background:var(--soft)}
.task .del{background:none;border:0;cursor:pointer;color:var(--muted)}
.task .late-t{color:var(--bad);font-weight:700}
.addt{display:flex;gap:6px;padding:8px}
.addt input{height:36px;font-size:14px}
.addt .btn{height:36px}
.col.new{background:none;border:2px dashed var(--line);padding:10px}
.col.new form{display:flex;gap:6px}
/* التسجيل */
#onb{position:fixed;inset:0;background:rgba(0,10,40,.55);display:grid;place-items:center;z-index:20;padding:16px}
#onb[hidden]{display:none}
.ob{background:var(--panel);border-radius:20px;width:min(540px,100%);max-height:100%;overflow:auto;padding:22px;display:grid;gap:12px}
.ob h2{margin:0;font-size:24px;line-height:1.2;color:var(--ocean)}
.ob p{margin:0;color:var(--muted)}
.obg{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:start}
#prev{width:120px;height:150px;background:var(--soft);border-radius:14px}
.lbl{font-size:13px;font-weight:700;margin:6px 0 4px;color:var(--muted)}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw button.on{border-color:var(--violet)}
.sw.t button{width:auto;border-radius:999px;padding:0 14px;background:var(--soft);font-size:14px;height:36px}
.sw.t button.on{background:var(--violet);color:#fff;border-color:var(--violet)}
.err{color:var(--bad);font-size:13px;min-height:1em}
#unlock{position:absolute;top:12px;right:50%;transform:translateX(50%);z-index:8}
#unlock[hidden]{display:none}
@media(max-width:700px){
 #panel{left:8px;right:8px;width:auto;top:auto;height:58%;bottom:8px}
 #panel.hide{transform:translateY(24px)}
 .online span,.logo small{display:none}
 header{gap:8px;padding:0 10px}
 header select{max-width:110px}
 .obg{grid-template-columns:minmax(0,1fr)}#prev{width:100%;height:120px}
 #board{left:6px;right:6px;top:6px;bottom:6px}
 .col{width:250px}
 #vbar{bottom:8px}
}
@media(max-width:520px){#floor{display:none}.logo{font-size:16px}#vbar .ppl{display:none}}
@media(prefers-reduced-motion:reduce){#panel,.toast{transition:none;animation:none}}
</style>
</head>
<body>
<header>
 <div class="logo">DOMAINS<small>المكتب الافتراضي</small></div>
 <select id="floor" aria-label="الطابق">
  <option selected>الطابق 3 · DOMAINS</option>
  <option disabled>الطابق 1 · سنكري القابضة (قريباً)</option>
  <option disabled>الطابق 2 · مؤسسة المجد (قريباً)</option>
  <option disabled>الطابق 4 · آركدن الهندسية (قريباً)</option>
  <option disabled>الطابق 5 · مول أوف اليبو (قريباً)</option>
 </select>
 <div class="sp"></div>
 <div class="online"><i id="conn"></i><b id="onCount">1</b><span>&nbsp;في المكتب الآن</span></div>
 <select id="status" aria-label="حالتي">
  <option value="free">🟢 متاح</option>
  <option value="busy">🟡 مشغول</option>
  <option value="focus">🔴 تركيز · لا إزعاج</option>
 </select>
 <button class="hb" id="meBtn">شكلي</button>
</header>
<div id="stage">
 <canvas id="map" aria-label="خريطة المكتب"></canvas>
 <div class="help" id="help">تحرّك بالأسهم أو WASD، أو انقر على الأرض</div>
 <aside id="panel" class="hide"></aside>
 <section id="board" hidden></section>
 <div id="vbar" hidden></div>
 <div id="screen" hidden><div class="sh"><span id="scrTitle">شاشة مشتركة</span><button id="scrFull">تكبير</button><button id="scrHide">إخفاء</button></div><video id="scrVid" autoplay playsinline muted></video></div>
 <button class="btn vi" id="unlock" hidden>اضغط لتفعيل سماع الصوت</button>
 <div id="toasts"></div>
 <div id="audios" hidden></div>
</div>

<div id="onb" hidden>
 <form class="ob" id="obForm">
  <h2>أهلاً بك في مكتب DOMAINS</h2>
  <p>اختر اسمك وشكلك، ثم ادخل وامشِ إلى أي مكتب فارغ لتحجزه.</p>
  <div class="obg">
   <canvas id="prev"></canvas>
   <div>
    <div class="lbl">الاسم</div><input id="obName" required maxlength="30" placeholder="مثال: محمد إياد">
    <div class="lbl">الدور في الفريق</div><input id="obRole" maxlength="40" placeholder="مثال: مدير المشروع">
   </div>
  </div>
  <div><div class="lbl">الجنس</div><div class="sw t" id="swGender"><button type="button" data-v="m">ذكر</button><button type="button" data-v="f">أنثى</button></div></div>
  <div><div class="lbl">لون اللباس</div><div class="sw" id="swShirt"></div></div>
  <div><div class="lbl">المظهر</div><div class="sw t" id="swStyle"></div><div class="sw" id="swHair" style="margin-top:6px"></div></div>
  <div><div class="lbl">لون البشرة</div><div class="sw" id="swSkin"></div></div>
  <div id="codeBox" hidden><div class="lbl">رمز الدخول للفريق</div><input id="obCode" maxlength="80" autocomplete="off"></div>
  <div class="err" id="obErr"></div>
  <button class="btn" style="height:46px">ادخل المكتب</button>
 </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
const LAPTOP=matchMedia('(pointer:fine)').matches&&Math.max(screen.width,screen.height)>=1000;
if(!LAPTOP){document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#00175A;color:#fff;text-align:center"><div style="max-width:420px"><div style="font-size:26px;font-weight:800;letter-spacing:.5px;margin-bottom:18px">DOMAINS</div><h1 style="font-size:24px;margin:0 0 12px;line-height:1.3">المكتب الافتراضي مخصص للابتوب</h1><p style="margin:0;opacity:.85;font-size:16px;line-height:1.7">افتح هذا الرابط من اللابتوب (Chrome أو Edge) لتدخل المكتب وتتحرك فيه وتشارك في الاجتماعات الصوتية ومشاركة الشاشة.</p></div></div>';return}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* ================= الخريطة ================= */
const W=1760,H=900;
const ROOMS=[
 {id:'manager',x:12,y:12,w:360,h:300,c:'#e5e8f8'},
 {id:'reception',x:12,y:476,w:360,h:412,c:'#e8ecf8'},
 {id:'meeting',x:1020,y:12,w:368,h:408,c:'#e9e4fb'},
 {id:'lounge',x:1020,y:526,w:368,h:362,c:'#f4ede3'},
 {id:'planning',x:1400,y:12,w:348,h:876,c:'#e4ecf7'}];
const PODS=[{id:'t',name:'مسار التدريب',x:430,y:150},{id:'e',name:'مسار الفعاليات',x:720,y:150},{id:'v',name:'مسار التطوع',x:430,y:560},{id:'p',name:'مسار المشاريع',x:720,y:560}];
const DESKS=[{id:'m1',zone:'مكتب مدير المشروع',x:120,y:110,w:150,h:60,seat:{x:195,y:88},colX:300,top:true}];
PODS.forEach(p=>{for(let i=0;i<4;i++){const dx=(i%2)*96,dy=i<2?0:56,x=p.x+dx,y=p.y+dy;DESKS.push({id:p.id+(i+1),zone:p.name,x,y,w:90,h:50,seat:{x:x+45,y:i<2?p.y-22:p.y+128},colX:p.x-26,top:i<2})}});
const BOARDS=[['general','لوحة DOMAINS العامة','#0616C4'],['training','مسار التدريب','#1f9d74'],['events','مسار الفعاليات','#8042EB'],['projects','مسار المشاريع','#e09612'],['volunteer','مسار التطوع','#e5484d']].map(([id,title,c],i)=>({id,title,c,y:110+i*170,front:{x:1640,y:110+i*170}}));
const WALLS=[[0,0,W,12],[0,888,W,12],[0,0,12,H],[W-12,0,12,H],
 [366,12,12,300],[12,306,248,12],[340,306,38,12],
 [12,470,250,12],[342,470,36,12],[366,470,12,290],[366,860,12,28],
 [1014,414,250,12],[1344,414,44,12],
 [1014,520,60,12],[1160,520,228,12],[1014,520,12,368],
 [1388,12,12,410],[1388,520,12,368]];
const GLASS=[[1014,12,12,408]];
const FURN=[...PODS.map(p=>[p.x,p.y,186,106]),[120,110,150,60],[1110,140,190,140],[120,580,180,46],[1336,560,44,200],[1060,800,170,46],[1090,720,110,40],[24,140,26,120],...BOARDS.map(b=>[1708,b.y-62,32,124])];
const SOLIDS=[...WALLS,...GLASS,...FURN];

const keys=new Set();let goal=null,guide=null;
addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){keys.add(k);goal=null;e.preventDefault()}});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();goal={x:(e.clientX-r.left-pad)/scale+cam.x,y:(e.clientY-r.top)/scale+cam.y};if(document.activeElement)document.activeElement.blur()});
function stepMe(dt){
 let vx=0,vy=0;
 if(keys.has('arrowup')||keys.has('w'))vy-=1;if(keys.has('arrowdown')||keys.has('s'))vy+=1;
 if(keys.has('arrowleft')||keys.has('a'))vx-=1;if(keys.has('arrowright')||keys.has('d'))vx+=1;
 if(!vx&&!vy&&goal){const dx=goal.x-me.x,dy=goal.y-me.y,l=Math.hypot(dx,dy);if(l<4)goal=null;else{vx=dx/l;vy=dy/l}}
 const l=Math.hypot(vx,vy);me.moving=l>0;if(!l)return false;
 const sp=220*dt;vx=vx/l*sp;vy=vy/l*sp;const ox=me.x,oy=me.y;
 if(!hits(me.x+vx,me.y,12))me.x+=vx;if(!hits(me.x,me.y+vy,12))me.y+=vy;
 if(goal&&me.x===ox&&me.y===oy)goal=null;
 return me.x!==ox||me.y!==oy;
}
function botRoute(b,to){
 const d=deskOf(b.desk),c=d.colX,seat=d.seat,aisle={x:c,y:420};
 let pts=[];
 if(b.at==='desk')pts.push({x:c,y:seat.y},aisle);
 if(b.at==='meeting')pts.push({x:1304,y:380},{x:1304,y:470},{x:1000,y:470},aisle);
 if(b.at==='lounge')pts.push({x:1117,y:580},{x:1117,y:470},{x:1000,y:470},aisle);
 const i=BOTS.indexOf(b);
 if(to==='desk')pts.push(aisle,{x:c,y:seat.y},seat);
 if(to==='meeting')pts.push({x:1000,y:470},{x:1304,y:470},{x:1304,y:380},MEET_SEATS[i]);
 if(to==='lounge')pts.push({x:1000,y:470},{x:1117,y:470},{x:1117,y:580},{x:1110+i*70,y:660});
 if(b.at===to)return;b.route=pts;b.at=to;
}
function stepBots(dt){const now=Date.now();BOTS.forEach(b=>{
 if(b.route.length){const p=b.route[0],dx=p.x-b.x,dy=p.y-b.y,l=Math.hypot(dx,dy),sp=170*dt;b.moving=true;if(l<=sp){b.x=p.x;b.y=p.y;b.route.shift()}else{b.x+=dx/l*sp;b.y+=dy/l*sp}}else b.moving=false;
 if(!b.route.length&&now>b.next&&!(cur&&cur.type==='person'&&cur.id===b.id)&&b.at!=='meeting'){b.next=now+45000+Math.random()*40000;botRoute(b,b.at==='desk'?'lounge':'desk');if(b.at==='lounge')b.next=now+18000}
 if(b.say&&now>b.say.until)b.say=null;
})}

 let best=null,bd=1e9;const cand=(d,t)=>{if(d<bd){bd=d;best=t}};
 const rd=dist(me,RECEPT);if(rd<110)cand(rd,{type:'reception',key:'reception'});
 BOTS.forEach(b=>{const d=dist(me,b);if(d<70)cand(d,{type:'person',id:b.id,key:'p:'+b.id})});
 peers.forEach(p=>{if(p.uid&&p.uid!==me.id){const d=dist(me,p.pos);if(d<60)cand(d-25,{type:'person',id:p.uid,key:'p:'+p.uid})}});
 DESKS.forEach(dk=>{const d=Math.min(Math.hypot(me.x-(dk.x+dk.w/2),me.y-(dk.y+dk.h/2)),dist(me,dk.seat)+10);if(d<80){const o=deskOwner(dk);
  if(!o)cand(d+5,{type:'free',desk:dk.id,key:'f:'+dk.id});else if(o===me.id)cand(d+5,{type:'mine',desk:dk.id,key:'m:'+dk.id});else cand(d+5,{type:'person',id:o,key:'p:'+o})}});
 return best;
}

 if(me.name)ents.push({y:me.y,draw:()=>drawAvatar(ctx,me.x,me.y,me.look,{t,moving:me.moving,status:me.status,me:true,voice:!!V.channel,speaking:V.speaking.has('me')}),tag:()=>tag(me.x,me.y,me.name+' (أنت)',{me:true,say:me.say&&me.say.text})});
